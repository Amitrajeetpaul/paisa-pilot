name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest rules_engine/ llm/ api/ agents/ -q
      - run: python -m mypy rules_engine llm api agents
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud (Workload Identity Federation)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy API
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/paisa-pilot/api:${GITHUB_SHA}"
          scripts/cloud_build.sh "$PROJECT_ID" infra/cloudbuild-api.yaml "_IMAGE=${IMAGE}"
          gcloud run deploy paisa-pilot-api --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE"

      - name: Build and deploy web (bakes in the API URL)
        run: |
          API_URL=$(gcloud run services describe paisa-pilot-api --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/paisa-pilot/web:${GITHUB_SHA}"
          scripts/cloud_build.sh "$PROJECT_ID" infra/cloudbuild-web.yaml "_IMAGE=${IMAGE},_API_URL=${API_URL}"
          gcloud run deploy paisa-pilot-web --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE"

      - name: Smoke test
        run: |
          API_URL=$(gcloud run services describe paisa-pilot-api --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          WEB_URL=$(gcloud run services describe paisa-pilot-web --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl -sf "$API_URL/openapi.json" > /dev/null
          SID=$(curl -sf -X POST "$API_URL/demo/sample-session" | python3 -c "import sys,json;print(json.load(sys.stdin)['session_id'])")
          curl -sf -X POST "$API_URL/sessions/$SID/calculate/money-finder" > /dev/null
          curl -sf "$WEB_URL/" > /dev/null
          echo "Deployed: $WEB_URL"
