[project]
name = "paisa-pilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "PyYAML==6.0.3",
  "pydantic==2.14.3",
  "google-genai==2.34.0",
  "fastapi==0.165.0",
  "python-multipart==0.0.34",
  "google-adk==2.14.1",
  "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["rules_engine/tests", "llm/tests", "api/tests", "agents/tests"]

[tool.mypy]
python_version = "3.12"
packages = ["rules_engine", "llm", "api", "agents"]
ignore_missing_imports = true
